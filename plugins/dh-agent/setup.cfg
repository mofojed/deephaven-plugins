[metadata]
name = deephaven-plugin-dh-agent
description = Local LLM agent widget for Deephaven (deephaven.ui based)
long_description = file: README.md
long_description_content_type = text/markdown
version = 0.0.1.dev0
url = https://github.com/deephaven/deephaven-plugins
project_urls =
    Source Code = https://github.com/deephaven/deephaven-plugins
    Bug Tracker = https://github.com/deephaven/deephaven-plugins/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: Apache Software License
    Operating System :: OS Independent
    Environment :: Plugins
    Topic :: Scientific/Engineering :: Artificial Intelligence
    Development Status :: 3 - Alpha
keywords = deephaven, plugin, llm, agent, ai, ollama
author = Deephaven Data Labs
author_email = support@deephaven.io
platforms = any

[options]
package_dir =
    =src
packages = find:
install_requires =
    deephaven-core>=0.39.6
    deephaven-plugin-ui>=0.28.0
    ollama>=0.3.0
    numpy>=1.22
    httpx>=0.24
    typing_extensions;python_version<'3.11'
include_package_data = True
python_requires = >=3.9

[options.packages.find]
where = src
include = dh_agent*
