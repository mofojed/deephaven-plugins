plugins {
    id 'groovy'
    id 'java-library'
}

group = 'io.deephaven'
version = '0.1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

ext {
    deephavenVersion = project.findProperty('deephavenVersion') ?: '0.39.6'
    jacksonVersion = '2.17.2'
}

dependencies {
    compileOnly "io.deephaven:deephaven-plugin:${deephavenVersion}"
    compileOnly "io.deephaven:deephaven-engine-api:${deephavenVersion}"

    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation 'com.flipkart.zjsonpatch:zjsonpatch:0.4.16'
    implementation 'org.apache.groovy:groovy:4.0.22'

    testImplementation 'org.apache.groovy:groovy:4.0.22'
    testImplementation 'org.spockframework:spock-core:2.3-groovy-4.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Tests that instantiate ObjectType subclasses (DashboardType/ElementType) need the SPI on
    // the test classpath; compileOnly above only puts it on the main classpath.
    testImplementation "io.deephaven:deephaven-plugin:${deephavenVersion}"
}

// Copy the JS bundle produced by the Python plugin's build into this JAR's resources.
def jsBundleSource = project.findProperty('jsBundleSource')
        ?: rootProject.file('../ui/src/deephaven/ui/_js/dist')

tasks.register('copyJsBundle', Copy) {
    description = 'Copy the @deephaven/js-plugin-ui bundle into the JAR resources.'
    from jsBundleSource
    into layout.buildDirectory.dir('resources/main/io/deephaven/ui/js/dist')
    // The JS bundle is optional at build time; downstream consumers may install it later.
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

processResources.dependsOn(tasks.named('copyJsBundle'))

test {
    useJUnitPlatform()
}

// The Deephaven server-slim image puts /apps/libs/* on the JVM classpath. It already provides
// Jackson and Groovy at runtime, but NOT zjsonpatch (or anything else we add). Copy the
// non-server-provided runtime deps next to our JAR so the docker-compose mount picks them up.
configurations {
    bundledRuntime {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    // Only deps the server doesn't already provide — keep this minimal to avoid version conflicts.
    // Jackson is on the server classpath; exclude it (and zjsonpatch's other transitives we don't need).
    bundledRuntime('com.flipkart.zjsonpatch:zjsonpatch:0.4.16') {
        exclude group: 'com.fasterxml.jackson.core'
        exclude group: 'com.fasterxml.jackson.databind'
        exclude group: 'org.apache.commons'
        transitive = false
    }
}

tasks.register('copyBundledDeps', Copy) {
    description = 'Copy runtime deps not provided by the Deephaven server image into build/libs.'
    from configurations.bundledRuntime
    into layout.buildDirectory.dir('libs')
}

tasks.named('jar') { finalizedBy('copyBundledDeps') }
tasks.named('assemble') { dependsOn('copyBundledDeps') }
