# Default dev-server harness when you run `docker compose up` from `groovy-plugins/`. Loads
# BOTH the ui-groovy and plotly-express plugins so you can exercise widgets and charts from a
# single server.
#
# Usage (from this directory):
#   ./gradlew assembleAll                                     # aggregate all plugin JARs into build/libs
#   docker compose up                                         # http://localhost:10000
#   # Fast-iteration loop: hit a widget directly without the Panels dance, e.g.
#   #   http://localhost:10000/iframe/widget/?name=scatter_fig
#   #   http://localhost:10000/iframe/widget/?name=ui_component
#
# Per-plugin compose files still live under each module:
#   - ui-groovy/run/         — ui-groovy alone
#   - plotly-express/run/    — plotly-express alone
#   - <module>/tests/        — Playwright e2e harness

services:
  deephaven:
    image: ghcr.io/deephaven/server-slim:edge
    ports:
      - "10000:10000"
    volumes:
      # `./gradlew assembleAll` collects each subproject's plugin JAR into build/libs at the
      # groovy-plugins root, then this single mount puts them all on server-slim's classpath.
      - ./build/libs:/apps/libs:ro
      # Combined app.d with one demo from each plugin so the server has something to render.
      - ./app.d:/app.d:ro
    environment:
      - START_OPTS=-Xmx2g -DAuthHandlers=io.deephaven.auth.AnonymousAuthenticationHandler -Ddeephaven.console.type=groovy -Ddeephaven.application.dir=/app.d
