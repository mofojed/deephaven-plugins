// deephaven-plugin-ui-groovy — JVM-native backend for the deephaven.ui widget. Shared gradle
// config (java toolchain, groovy version, common test deps, log backend) is in the parent
// build.gradle; this file declares only what's specific to this plugin.

// Preserve the artifact base name that downstream consumers already reference; the directory
// (and gradle project) is just :ui-groovy.
base {
    archivesName = 'deephaven-plugin-ui-groovy'
}

dependencies {
    compileOnly "io.deephaven:deephaven-plugin:${deephavenVersion}"
    compileOnly "io.deephaven:deephaven-engine-api:${deephavenVersion}"
    // Used by live-data hooks for table snapshot iteration and listener registration.
    compileOnly "io.deephaven:deephaven-engine-rowset:${deephavenVersion}"
    // InstrumentedTableUpdateListenerAdapter (engine table impl). The server provides it at runtime.
    compileOnly "io.deephaven:deephaven-engine-table:${deephavenVersion}"
    // AwareFunctionalLock / SafeCloseable used when attaching the table listener.
    compileOnly "io.deephaven:deephaven-engine-updategraph:${deephavenVersion}"
    compileOnly "io.deephaven:deephaven-Util:${deephavenVersion}"

    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    implementation 'com.flipkart.zjsonpatch:zjsonpatch:0.4.16'

    // Tests that instantiate ObjectType subclasses (DashboardType/ElementType) need the SPI on
    // the test classpath; compileOnly above only puts it on the main classpath.
    testImplementation "io.deephaven:deephaven-plugin:${deephavenVersion}"
    // Ui.groovy references engine-api/engine-context types; the test compiler needs them too.
    testImplementation "io.deephaven:deephaven-engine-api:${deephavenVersion}"
    testImplementation "io.deephaven:deephaven-engine-context:${deephavenVersion}"
    // RenderContext/useMemo reference LivenessScope (engine-updategraph).
    testImplementation "io.deephaven:deephaven-engine-updategraph:${deephavenVersion}"
    testImplementation "io.deephaven:deephaven-Util:${deephavenVersion}"
}

// Copy the JS bundle produced by the Python plugin's build into this JAR's resources. Path is
// relative to the gradle root (groovy-plugins/), so the repo's plugins/ui/ dir is one level up.
def jsBundleSource = project.findProperty('jsBundleSource')
        ?: rootProject.file('../plugins/ui/src/deephaven/ui/_js/dist')

tasks.register('copyJsBundle', Copy) {
    description = 'Copy the @deephaven/js-plugin-ui bundle into the JAR resources.'
    from jsBundleSource
    into layout.buildDirectory.dir('resources/main/io/deephaven/ui/js/dist')
    // The JS bundle is optional at build time; downstream consumers may install it later.
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

processResources.dependsOn(tasks.named('copyJsBundle'))

// The Deephaven server-slim image puts /apps/libs/* on the JVM classpath. It already provides
// Jackson and Groovy at runtime, but NOT zjsonpatch (or anything else we add). Copy the
// non-server-provided runtime deps next to our JAR so the docker-compose mount picks them up.
configurations {
    bundledRuntime {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    // Only deps the server doesn't already provide — keep this minimal to avoid version conflicts.
    // Jackson is on the server classpath; exclude it (and zjsonpatch's other transitives we don't need).
    bundledRuntime('com.flipkart.zjsonpatch:zjsonpatch:0.4.16') {
        exclude group: 'com.fasterxml.jackson.core'
        exclude group: 'com.fasterxml.jackson.databind'
        exclude group: 'org.apache.commons'
        transitive = false
    }
}

tasks.register('copyBundledDeps', Copy) {
    description = 'Copy runtime deps not provided by the Deephaven server image into build/libs.'
    from configurations.bundledRuntime
    into layout.buildDirectory.dir('libs')
}

tasks.named('jar') { finalizedBy('copyBundledDeps') }
tasks.named('assemble') { dependsOn('copyBundledDeps') }
