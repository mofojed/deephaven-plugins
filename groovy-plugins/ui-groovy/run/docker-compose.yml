# Local dev harness: a Groovy-flavored Deephaven server with the ui-groovy plugin JAR mounted.
#
# Usage (from the repo root):
#   1. cd groovy-plugins && ./gradlew :ui-groovy:build  # produces ui-groovy/build/libs/*.jar
#   2. cd ui-groovy/run && docker compose up            # starts server on http://localhost:10000
#   3. Open http://localhost:10000                      # auth: anonymous
#
# Server-slim ships with -Ddeephaven.console.type=groovy by default and adds /apps/libs/* to
# the JVM classpath. The plugin JAR + bundled JS land there; ServiceLoader does the rest.

services:
  deephaven:
    image: ghcr.io/deephaven/server-slim:edge
    # No hardcoded container_name: this compose file is also `include`d from
    # ../../docker-compose.yml; a fixed name collides across compose projects. Compose generates
    # `<project>-deephaven-1` automatically (e.g. run-deephaven-1 or groovy-plugins-deephaven-1).
    ports:
      - "10000:10000"
    volumes:
      - ../build/libs:/apps/libs:ro
      - ./app.d:/app.d:ro
    environment:
      - START_OPTS=-Xmx2g -DAuthHandlers=io.deephaven.auth.AnonymousAuthenticationHandler -Ddeephaven.console.type=groovy -Ddeephaven.application.dir=/app.d
